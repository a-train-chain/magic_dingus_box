# Media Browser V2 — Companion Services
# Deployed to /opt/magic_dingus_box/services/ on the Pi.
# Managed by magic-dingus-services.service (systemd).
# All images pinned to known-good versions for reproducibility.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: mdb_radarr
    # Behind Gluetun: shares VPN netns. Even Radarr's TMDB metadata
    # fetches now exit via VPN (was direct via Comcast residential IP).
    # No per-service ports: block — Radarr's :7878 must be exposed via
    # gluetun's ports: section for host-side access (added in the
    # FlareSolverr→Byparr task, which collects all behind-Gluetun
    # ports into one place).
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      # Legacy split mounts (kept for backward-compat with existing
      # installs whose radarr.db still stores /library + /downloads paths).
      - ${STORAGE_ROOT}/downloads:/downloads
      - ${STORAGE_ROOT}/library:/library
      # Single parent mount that ENABLES INSTANT HARDLINK IMPORTS. With
      # both downloads and library visible under ONE container mount
      # (/data), Radarr can hardlink a finished download into the library
      # instead of copying it (EXDEV across the two separate mounts above
      # forces a full byte copy — ~15-50s per movie + a duplicate on-disk
      # copy for every seeding torrent). This mount is INERT until Radarr's
      # root folder is repointed to /data/library and qBit saves to
      # /data/downloads. Adding it here changes NOTHING on its own — it's
      # laid down ahead of the migration so the mount already exists when
      # you run the one-time DB path rewrite.
      #
      # TO ACTIVATE (one-time, on a populated library — do this ATTENDED,
      # with a radarr.db backup):
      #   scripts/migrate_hardlink_layout.sh   (tested, transactional)
      # It rewrites RootFolders.Path + Movies.Path /library -> /data/library
      # in radarr.db and bulk-"Set location"s qBit torrents to
      # /data/downloads. See docs/.../2026-07-09-import-hardlink-
      # investigation.md for the full rationale + rollback.
      - ${STORAGE_ROOT}:/data
    # `always` (not `unless-stopped`) — Radarr can exit cleanly with code
    # 0 during internal config reloads (e.g., when setup_services.sh
    # writes new download-client/indexer state and Radarr decides to
    # restart itself). `unless-stopped` interprets a clean exit as
    # "user wanted to stop" and leaves the container down indefinitely
    # — which is what produced the multi-hour outage caught by the
    # smoke test on first install. `always` restarts on every exit
    # regardless of code.
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5
    container_name: mdb_prowlarr
    # Behind Gluetun: shares VPN netns. DNS handled by gluetun, no
    # per-service dns: block needed. No per-service ports: block —
    # Prowlarr's :9696 must be exposed via gluetun's ports: section
    # for host-side access (added in the FlareSolverr→Byparr task,
    # which collects all behind-Gluetun ports into one place).
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    # `always` for the same reason as radarr above: Prowlarr can also
    # exit 0 on internal restart, and `unless-stopped` would leave it
    # dead indefinitely.
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: mdb_gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      # OpenVPN credentials (used only when VPN_TYPE=openvpn — harmless when
      # empty / when wireguard is active).
      - OPENVPN_USER=${VPN_USERNAME:-}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:-}
      # Wireguard config (used when VPN_TYPE=wireguard, which is the default).
      # Without these explicit pass-throughs the Wireguard backend fails on
      # every fresh container start with "private key is not set" — discovered
      # post-reboot when the running container restarted clean. The .env's
      # WIREGUARD_* values are not auto-injected by compose; each one has to
      # be enumerated here.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY:-}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Netherlands}
      - SERVER_FEATURES=${SERVER_FEATURES:-}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      # Allow LAN + docker inter-container traffic through firewall.
      #
      # CRITICAL: do NOT use the broad 10.0.0.0/8 here, even though it's
      # the textbook "private RFC1918" subnet. ProtonVPN's WireGuard
      # gateway lives at 10.2.0.1 — INSIDE 10.0.0.0/8 — so listing
      # 10.0.0.0/8 as a LAN-bypass subnet makes Gluetun's iptables
      # route NAT-PMP requests (UDP to 10.2.0.1:5351) out the LAN
      # interface instead of through the WireGuard tunnel where the
      # gateway actually lives. The requests then time out (`read udp
      # ...:5351: i/o timeout` in gluetun logs), and the port
      # forwarding service gives up after 9 retries. Result: VPN port
      # status reads "unavailable" in the Content Manager dashboard,
      # incoming peer connections fail, torrent speeds tank.
      #
      # Narrow each LAN to the specific subnet we actually use:
      #   10.0.0.0/24    — typical home Wi-Fi (Pi gets 10.0.0.x)
      #   10.55.0.0/24   — USB Gadget interface (usb0 = 10.55.0.1)
      #   192.168.0.0/16 — alternative home Wi-Fi convention
      #   172.16.0.0/12  — Docker inter-container bridges
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24,10.55.0.0/24,192.168.0.0/16,172.16.0.0/12
      # Disable DNS-over-TLS. Gluetun's default DoT resolver maintains a
      # long-lived TLS connection to the upstream (Cloudflare 1.1.1.1 by
      # default); when that pipe stalls — which it does on this Pi on
      # roughly daily cadence — *all* subsequent DNS queries inside the
      # netns time out, even though Gluetun's own healthcheck stays
      # green (it uses an internal cached IP endpoint that needs no DNS).
      # Symptom: Radarr can't reach api.radarr.video, Prowlarr can't
      # reach indexers.prowlarr.com, indexer searches return 0 results
      # across the board, kiosk shows "no source found" on Detail pages.
      # Recovery pre-fix required a full Pi reboot.
      #
      # Plain DNS over UDP to the same upstream is stateless — each query
      # is independent, no TLS handshake to wedge. Marginally less private
      # (the queries themselves are visible on-wire) but we're already
      # tunneled through ProtonVPN's WireGuard, so the threat model
      # doesn't really change: the only observer of the DNS traffic
      # would be ProtonVPN itself, which can already see all our DNS
      # via DoT anyway (it's the upstream resolver).
      - DOT=off
      - TZ=${TZ}
    ports:
      # qBittorrent web UI + peer ports are exposed via Gluetun.
      # WebUI: 127.0.0.1 only (admin requires SSH tunnel).
      # BitTorrent peer port: public — needed for peer connectivity/seeding;
      # BitTorrent protocol itself does not expose admin surface.
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
      # Behind-Gluetun service admin/internal ports.
      # All loopback-bound; admin UI requires SSH tunnel.
      - "127.0.0.1:7878:7878"   # Radarr
      - "127.0.0.1:9696:9696"   # Prowlarr
      - "127.0.0.1:8191:8191"   # Byparr (Cloudflare bypass)
    volumes:
      - ./config/gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      # Hit Cloudflare's `one.one.one.one` via HTTPS rather than gluetun's
      # own /v1/publicip/ip endpoint. The internal endpoint reports
      # "healthy" even when egress is broken — it returns a cached IP
      # value with no DNS lookup. That's the bug we hit on 2026-05-26
      # where DoT got wedged: containers couldn't resolve any hostname,
      # all indexer searches returned 0, but gluetun stayed green for
      # hours until a manual reboot.
      #
      # one.one.one.one (Cloudflare's official hostname for 1.1.1.1):
      #   - Requires DNS lookup → fails fast when the resolver wedges
      #   - HTTPS → exercises TCP connect + TLS handshake through the
      #     VPN tunnel
      #   - /cdn-cgi/trace returns plain text with `ip=...`, `loc=...`
      #     etc. — the grep confirms we got a sensible 200 body.
      #   - No rate-limit / Cloudflare challenge issues even on ProtonVPN
      #     exit IPs (Cloudflare owns the endpoint and never blocks its
      #     own infrastructure)
      #
      # Failure of any layer (DNS, TCP, TLS, content) → wget returns
      # non-zero → grep fails → exit 1 → container marked unhealthy.
      # The cascade-restart watcher (gluetun_cascade_restart.sh) catches
      # the resulting health_status:unhealthy event and restarts gluetun,
      # which then fires a start event that cascades to dependents.
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=5 https://one.one.one.one/cdn-cgi/trace | grep -q '^ip='"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    container_name: mdb_qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      # Legacy mount (existing torrents' save path is /downloads).
      - ${STORAGE_ROOT}/downloads:/downloads
      # Parent mount matching Radarr's /data (see radarr service above).
      # qBit must see completed files at the SAME container path Radarr
      # imports from for hardlinks to work. Inert until qBit's save path
      # is moved to /data/downloads by the migration script.
      - ${STORAGE_ROOT}:/data
    # `always` — same reasoning as radarr/prowlarr.
    restart: always

  byparr:
    # Drop-in FlareSolverr-API replacement that handles current
    # Cloudflare challenge formats (FlareSolverr's last release v3.4.6
    # cannot). API-compatible — Prowlarr's "FlareSolverr" indexer-proxy
    # configuration in prowlarr_indexerproxies.json continues to work
    # because the proxy's *name* is unchanged; only the URL points to
    # byparr now.
    image: ghcr.io/thephaseless/byparr@sha256:01a46a2865d9a6db5eb8ead04ec0dd33b8fbe233e8565ae70b50d4cc0af4cfb0
    container_name: mdb_byparr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    # `always` — Prowlarr's "FlareSolverr" indexer-proxy entries hit
    # this on every Cloudflare-tagged search; if Byparr is down,
    # those indexers silently return zero results until restart. Same
    # clean-exit failure mode as the *arr containers.
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8191/"]
      interval: 60s
      timeout: 10s
      retries: 3

# Services share the default bridge network; inter-container DNS resolves names.
# Radarr reaches qBittorrent via http://gluetun:8080 (qBittorrent shares
# Gluetun's network namespace, so its WebUI is accessible at the gluetun
# container's hostname).
# Kiosk C++ reaches all services via localhost:<port> (host network).
