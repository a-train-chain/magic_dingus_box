# Media Browser V2 — Companion Services
# Deployed to /opt/magic_dingus_box/services/ on the Pi.
# Managed by magic-dingus-services.service (systemd).
# All images pinned to known-good versions for reproducibility.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: mdb_radarr
    # Explicit DNS: avoids post-reboot race where Docker's internal DNS
    # forwarder (127.0.0.11) doesn't yet have host resolv.conf populated,
    # causing SERVFAIL on api.radarr.video lookups. Pinning public resolvers
    # makes DNS independent of host boot timing.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${STORAGE_ROOT}/downloads:/downloads
      - ${STORAGE_ROOT}/library:/library
    ports:
      # Bind to 127.0.0.1 only — admin UI requires SSH tunnel, zero LAN attack surface.
      - "127.0.0.1:7878:7878"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.26.1
    container_name: mdb_prowlarr
    # Explicit DNS: see Radarr rationale above.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      # Bind to 127.0.0.1 only — admin UI requires SSH tunnel, zero LAN attack surface.
      - "127.0.0.1:9696:9696"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: mdb_gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      # OpenVPN credentials (used only when VPN_TYPE=openvpn — harmless when
      # empty / when wireguard is active).
      - OPENVPN_USER=${VPN_USERNAME:-}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:-}
      # Wireguard config (used when VPN_TYPE=wireguard, which is the default).
      # Without these explicit pass-throughs the Wireguard backend fails on
      # every fresh container start with "private key is not set" — discovered
      # post-reboot when the running container restarted clean. The .env's
      # WIREGUARD_* values are not auto-injected by compose; each one has to
      # be enumerated here.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY:-}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Netherlands}
      - SERVER_FEATURES=${SERVER_FEATURES:-}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      # Allow LAN + docker inter-container traffic through firewall.
      #
      # CRITICAL: do NOT use the broad 10.0.0.0/8 here, even though it's
      # the textbook "private RFC1918" subnet. ProtonVPN's WireGuard
      # gateway lives at 10.2.0.1 — INSIDE 10.0.0.0/8 — so listing
      # 10.0.0.0/8 as a LAN-bypass subnet makes Gluetun's iptables
      # route NAT-PMP requests (UDP to 10.2.0.1:5351) out the LAN
      # interface instead of through the WireGuard tunnel where the
      # gateway actually lives. The requests then time out (`read udp
      # ...:5351: i/o timeout` in gluetun logs), and the port
      # forwarding service gives up after 9 retries. Result: VPN port
      # status reads "unavailable" in the Content Manager dashboard,
      # incoming peer connections fail, torrent speeds tank.
      #
      # Narrow each LAN to the specific subnet we actually use:
      #   10.0.0.0/24    — typical home Wi-Fi (Pi gets 10.0.0.x)
      #   10.55.0.0/24   — USB Gadget interface (usb0 = 10.55.0.1)
      #   192.168.0.0/16 — alternative home Wi-Fi convention
      #   172.16.0.0/12  — Docker inter-container bridges
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24,10.55.0.0/24,192.168.0.0/16,172.16.0.0/12
      - TZ=${TZ}
    ports:
      # qBittorrent web UI + peer ports are exposed via Gluetun.
      # WebUI: 127.0.0.1 only (admin requires SSH tunnel).
      # BitTorrent peer port: public — needed for peer connectivity/seeding;
      # BitTorrent protocol itself does not expose admin surface.
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      # Hit gluetun's own control server at /v1/publicip/ip rather than
      # an external IP-check service. Two reasons:
      #   1. ifconfig.me / api.ipify.org / etc. occasionally serve Cloudflare
      #      challenge pages to ProtonVPN exit IPs, causing the healthcheck
      #      to flap. When flapping, qBittorrent (which has
      #      depends_on: gluetun: condition: service_healthy) refuses to
      #      start, and `systemctl start magic-dingus-services` fails.
      #   2. /v1/publicip/ip is gluetun's internal self-report of "I have a
      #      working VPN tunnel and can resolve outbound traffic" — exactly
      #      what we actually care about, with no third-party flakiness.
      # Endpoint returns JSON with public_ip, country, etc.; non-empty 200
      # response means the tunnel is up.
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=5", "http://localhost:8000/v1/publicip/ip"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    container_name: mdb_qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${STORAGE_ROOT}/downloads:/downloads
    restart: unless-stopped

  flaresolverr:
    # Pinned (matching this file's "all images pinned for reproducibility"
    # invariant) — :latest would silently pull a new build on `docker
    # compose pull` and could break Prowlarr's Cloudflare-bypass integration
    # if the API changes between versions. Bump deliberately, in a commit.
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: mdb_flaresolverr
    # Explicit DNS: see Radarr rationale above.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      # Bind to 127.0.0.1 only — internal CAPTCHA solver, not needed externally.
      - "127.0.0.1:8191:8191"
    restart: unless-stopped
    healthcheck:
      # Use curl (available in the image); wget is not shipped. FlareSolverr's
      # root URL returns a JSON "FlareSolverr is ready!" payload on success.
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8191/"]
      interval: 60s
      timeout: 10s
      retries: 3

# Services share the default bridge network; inter-container DNS resolves names.
# Radarr reaches qBittorrent via http://gluetun:8080 (qBittorrent shares
# Gluetun's network namespace, so its WebUI is accessible at the gluetun
# container's hostname).
# Kiosk C++ reaches all services via localhost:<port> (host network).
