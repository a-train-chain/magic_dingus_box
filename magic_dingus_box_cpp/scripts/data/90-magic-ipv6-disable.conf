# Magic Dingus Box — IPv6 off by default for every NEW connection.
# Installed to /etc/NetworkManager/conf.d/ by setup_network_hardening.sh.
#
# Why: home routers that advertise IPv6 which doesn't actually route are
# common, and a box that obtains a global v6 address on such a network
# black-holes every DNS lookup and HTTPS connection (TMDB posters, GitHub
# update checks, VPN re-provisioning) while the WireGuard tunnel — pinned
# v4 IP, no DNS — keeps working. Observed in the field 2026-08-05 on the
# first customer install. Everything this product talks to is v4-capable,
# so the robust posture is: never ask for v6 at all.
#
# This section supplies DEFAULTS: it applies when a profile does not set
# the property explicitly. Profiles created before this file existed (or
# written with an explicit ipv6.method) are repaired by the dispatcher
# script 90-magic-network-hardening, which force-modifies them on every
# connection up. Both layers are deliberate.
[connection-magic-ipv6]
match-device=type:wifi,type:ethernet
ipv6.method=disabled
