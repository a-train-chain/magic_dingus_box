# Magic Dingus Box — USB Gadget DHCP + catch-all DNS server
#
# Hands out an IPv4 lease to whatever device plugs into the Pi's
# USB-C port so the host (Mac/PC) auto-configures its USB Ethernet
# interface without manual setup. Plug in cable → host receives
# 10.55.0.10 (or next free) → host can immediately reach the Pi at
# 10.55.0.1:5000 (Content Manager) and resolve magicpi.local via mDNS.
#
# Listens ONLY on usb0 — does NOT interfere with wlan0 / eth0 DNS or
# the rest of the system network stack.

interface=usb0
bind-dynamic       # allow listening even when usb0 doesn't exist at boot

# Keep dnsmasq OFF the loopback interface. With interface= alone,
# dnsmasq also listens on lo by default — and the catch-all address=
# rule below would then poison any local process that queried
# 127.0.0.1:53. except-interface pins the DNS half to usb0 addresses
# exclusively, so queries arriving via Wi-Fi/Ethernet/loopback never
# see this server at all. (systemd-resolved owns 127.0.0.53 either
# way; this rule removes even the theoretical overlap.)
except-interface=lo

# Catch-all DNS for the cable: ANY hostname a plugged-in laptop types
# resolves to the box itself (dingus.box is the one we advertise; the
# only names this can't cover are .local ones, which the laptop
# resolves via mDNS without asking a DNS server). Paired with the
# port-80 → :5000 redirect (content-manager-redirect.service), typing
# "dingus.box" into a browser lands on the Content Manager with zero
# network knowledge. This rule answers every query authoritatively,
# so nothing is ever forwarded upstream.
#
# NOTE: DNS used to be fully disabled here (port=0) to avoid fighting
# systemd-resolved on wlan0. The interface scoping above achieves the
# same isolation while letting the usb0 side actually serve DNS —
# dnsmasq binds 10.55.0.1:53 only, resolved keeps 127.0.0.53, and the
# host's own lookups (getent, apt, OTA checks) never touch this
# instance. dnsmasq also auto-advertises itself as the DNS server in
# its DHCP offers once DNS is on, which is what points the laptop here.
address=/#/10.55.0.1

# Never read the host's /etc/resolv.conf or /etc/hosts: the catch-all
# answers everything, so upstream servers are pointless — and an
# /etc/hosts line like "127.0.1.1 magicpi5" must not leak a loopback
# address to a cabled laptop (it would take priority over address=).
no-resolv
no-hosts

# Lease range for connected hosts. .2-.9 reserved for static use,
# .10 onward gets handed out via DHCP.
dhcp-range=10.55.0.10,10.55.0.100,12h
dhcp-option=option:router,10.55.0.1
