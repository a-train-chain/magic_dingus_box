# Magic Dingus Box — USB Gadget DHCP server
#
# Hands out an IPv4 lease to whatever device plugs into the Pi's
# USB-C port so the host (Mac/PC) auto-configures its USB Ethernet
# interface without manual setup. Plug in cable → host receives
# 10.55.0.10 (or next free) → host can immediately reach the Pi at
# 10.55.0.1:5000 (Content Manager) and resolve magicpi.local via mDNS.
#
# Listens ONLY on usb0 — does NOT interfere with wlan0 / eth0 DNS or
# the rest of the system network stack.

interface=usb0
bind-dynamic       # allow listening even when usb0 doesn't exist at boot

# DNS-server functionality is fully disabled; this dnsmasq instance
# is DHCP-only. Avoids fighting with systemd-resolved on wlan0.
port=0

# Lease range for connected hosts. .2-.9 reserved for static use,
# .10 onward gets handed out via DHCP.
dhcp-range=10.55.0.10,10.55.0.100,12h
dhcp-option=option:router,10.55.0.1
