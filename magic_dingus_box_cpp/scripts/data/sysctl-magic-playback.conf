# Magic Dingus Box — playback-tuned sysctls
# Installed to /etc/sysctl.d/99-magic-playback.conf by setup_services.sh.
#
# Pi 4B: 1.6 GB RAM, zram swap (~1.6 GB compressed), shared with Docker
# stack and the kiosk. Without these tweaks, the kernel will aggressively
# swap kiosk pages out under cache pressure, which translates to a stall
# whenever the GStreamer pipeline allocates a fresh DMA buffer for the
# v4l2h264dec decoder.

# Default 60 → 10. Lower means: prefer reclaiming page cache pages over
# swapping out anonymous (kiosk-owned) pages when memory is tight.
# zram makes swap fast-ish but it's still a CPU-decompression hit, and
# the wakeup adds tens of ms of jitter.
vm.swappiness = 10

# Default 100 → 50. Lowering vfs_cache_pressure makes the kernel hold
# onto inode/dentry caches more aggressively. Helps the GStreamer
# demuxer's repeated stat()s of the movie file under cache pressure
# (otherwise the dentry can be evicted between reads, forcing a fresh
# directory walk).
vm.vfs_cache_pressure = 50
