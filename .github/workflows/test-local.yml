name: Local Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck yamllint jq python3-yaml python3-jsonschema

      - name: Verify bats version
        run: bats --version

      - name: Run local test tier
        run: ./tests/run_local_tests.sh --tap
