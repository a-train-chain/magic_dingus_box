name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Job 1: Build ARM64 binary using QEMU emulation
  build-arm64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Use Debian Trixie for libgpiod 2.x (Bookworm only has 1.6.x)
      - name: Build ARM64 binary
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/debian:trixie \
            bash -c '
              apt-get update && apt-get install -y \
                build-essential cmake pkg-config git file \
                libdrm-dev libgbm-dev libegl-dev libgles2-mesa-dev \
                libevdev-dev libgpiod-dev \
                libyaml-cpp-dev libjsoncpp-dev libcurl4-openssl-dev \
                libtorrent-rasterbar-dev libsqlite3-dev libboost-dev \
                libsystemd-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                gstreamer1.0-plugins-base gstreamer1.0-gl

              cd /workspace/magic_dingus_box_cpp
              mkdir -p build && cd build
              # ENABLE_MEDIA_BROWSER defaults OFF in CMakeLists. Production
              # boxes are always built with it ON (deploy_cpp.sh passes it;
              # the feature is triple-gated at runtime so un-provisioned
              # boxes never show it). Omitting it here shipped a binary
              # asset with the entire movie kiosk compiled out — and
              # update.sh PREFERS this binary over compiling on-Pi.
              # BUILD_TESTS=OFF: the release binary build has no use for
              # the Catch2 suites (they run in test-local.yml), and under
              # QEMU every extra TU costs multiplied minutes.
              cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_MEDIA_BROWSER=ON -DBUILD_TESTS=OFF ..
              make -j$(nproc)

              file magic_dingus_box_cpp

              # Release-blocking assertions. Both of these failed SILENTLY
              # in the past — the binary builds fine, runs fine, and dies
              # in the field:
              #   READY=1  — sd_notify support. libsystemd is an OPTIONAL
              #     CMake dep; without libsystemd-dev in this container the
              #     binary compiles without it and systemd (Type=notify)
              #     kills the healthy process at TimeoutStartSec on every
              #     box. Caught live on the v1.7.2 first-publish attempt.
              #   prowlarr — Media Browser compiled in. ENABLE_MEDIA_BROWSER
              #     defaults OFF; shipping an MB-less binary removes the
              #     movie kiosk from every box that installs it.
              file magic_dingus_box_cpp | grep -q aarch64 || { echo "FATAL: not an aarch64 binary"; exit 1; }
              strings magic_dingus_box_cpp | grep -q "READY=1" || { echo "FATAL: binary lacks sd_notify support (libsystemd-dev missing?)"; exit 1; }
              strings magic_dingus_box_cpp | grep -qi "prowlarr" || { echo "FATAL: Media Browser not compiled in"; exit 1; }
              echo "Binary assertions passed: aarch64, sd_notify, Media Browser"
            '

      - name: Package binary
        run: |
          cd magic_dingus_box_cpp/build
          tar -czvf ../../magic_dingus_box_cpp-arm64-${{ steps.version.outputs.VERSION }}.tar.gz magic_dingus_box_cpp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-binary
          path: magic_dingus_box_cpp-arm64-${{ steps.version.outputs.VERSION }}.tar.gz

  # Job 2: Create source tarball
  build-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update VERSION file
        run: echo "${{ steps.version.outputs.VERSION }}" > VERSION

      # Boxes keep the Media Browser compose file at the FLATTENED path
      # /opt/magic_dingus_box/services/docker-compose.yml — deploy_cpp.sh
      # rsyncs magic_dingus_box_cpp/services/ into it, and every consumer
      # (magic-dingus-services.service's WorkingDirectory,
      # gluetun-cascade-restart.sh, setup_services.sh) reads it there.
      #
      # The repo has no top-level services/ dir, so the tarball never had
      # one either — and update.sh's install rsync runs with --delete.
      # Net effect: the FIRST OTA of any box DELETED
      # services/docker-compose.yml (the services/.env and
      # services/config/* excludes kept the directory itself alive, which
      # is why nothing looked broken until something ran docker compose).
      # Then `docker compose up` → "no configuration file provided: not
      # found" → exit 14. Customer box magicpi-dc8a hit exactly this on
      # Reconfigure after 1.9.3 → 1.9.5 → 1.9.6, and every OTA'd box would
      # also have failed to start its stack on the next reboot.
      #
      # Mirror the directory at PACKAGE time so the tarball layout matches
      # the box layout. git keeps one source of truth
      # (magic_dingus_box_cpp/services/), and — critically — this fix
      # reaches boxes running the OLD update.sh, because their existing
      # rsync will now simply find the file in the tarball and install it.
      - name: Stage services/ at the on-box (flattened) layout
        run: |
          mkdir -p services
          cp magic_dingus_box_cpp/services/docker-compose.yml services/
          cp magic_dingus_box_cpp/services/.env.example services/
          ls -la services/

      - name: Create source archive
        run: |
          # Create tarball in /tmp first to avoid "file changed as we read it" error
          tar -czvf /tmp/magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='CMakeCache.txt' \
            --exclude='CMakeFiles' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.DS_Store' \
            --exclude='*.pyc' \
            --exclude='data/media/*' \
            --exclude='data/roms/*' \
            --exclude='dev_data' \
            --exclude='test_files' \
            --exclude='*.service.bak' \
            --exclude='.mypy_cache' \
            --exclude='.pytest_cache' \
            --exclude='*.log' \
            --exclude='*.tar.gz' \
            .
          # Move back to workspace
          mv /tmp/magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz .

      # Release-blocking layout assertions, in the spirit of the ARM64
      # job's aarch64 / READY=1 / prowlarr checks: an exclude pattern or a
      # moved file silently dropping one of these produces a tarball that
      # installs cleanly and breaks the box later.
      - name: Assert tarball layout
        run: |
          T=magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz
          tar -tzf "$T" > /tmp/listing.txt
          for p in ./services/docker-compose.yml \
                   ./magic_dingus_box_cpp/services/docker-compose.yml \
                   ./VERSION; do
            grep -qx "$p" /tmp/listing.txt || { echo "FATAL: $p missing from $T"; exit 1; }
          done
          # A secret must never ride along in the source tarball.
          ! grep -qx './services/.env' /tmp/listing.txt || { echo "FATAL: services/.env in tarball"; exit 1; }
          echo "Tarball layout assertions passed"

      - name: Generate SHA256 checksum
        run: |
          sha256sum magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz > checksum.sha256
          cat checksum.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: |
            magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz
            checksum.sha256

  # Job 3: Create GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-source]
    permissions:
      contents: write

    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            source-tarball/magic-dingus-box-${{ steps.version.outputs.VERSION }}.tar.gz
            source-tarball/checksum.sha256
            arm64-binary/magic_dingus_box_cpp-arm64-${{ steps.version.outputs.VERSION }}.tar.gz
          body: |
            ## Magic Dingus Box v${{ steps.version.outputs.VERSION }}

            ### Download Options
            | File | Description |
            |------|-------------|
            | `magic_dingus_box_cpp-arm64-*.tar.gz` | **Pre-compiled ARM64** (fast install) |
            | `magic-dingus-box-*.tar.gz` | Source code (requires compilation) |

            ### Update Instructions

            **From the Web Admin Interface:**
            1. Open the web admin in your browser
            2. Navigate to the **Settings** tab
            3. Click **Check for Updates**
            4. Click **Install Update** when prompted

            The update will automatically use the pre-compiled binary for faster installation.

            **Manual Update (SSH):**
            ```bash
            ssh magic@<your-device-ip>
            cd /opt/magic_dingus_box
            ./magic_dingus_box_cpp/scripts/update.sh check
            ./magic_dingus_box_cpp/scripts/update.sh install ${{ steps.version.outputs.VERSION }} <download_url>
            ```

            ### Checksum
            See `checksum.sha256` for source file verification.

            ---
            *Release created automatically by GitHub Actions*
