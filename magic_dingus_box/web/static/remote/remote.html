<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F191F">
<link rel="stylesheet" href="/static/remote/remote.css?v=15">
<!-- Shared app manifest, scoped to "/" so the Content Manager and the
     remote install as ONE app rather than two. The old
     /static/remote/manifest.json declared start_url "/admin/remote" while
     being served from /static/remote/, putting start_url outside its own
     implicit scope — a spec violation Chrome flags. -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dingus">
<title>Magic Dingus Remote</title>
</head>
<body class="remote">
<!--
  Panel modelled on the physical faceplate: gold pinstripe + cream inner
  rule, corner screws, SQUARE keycaps with LED light-pipe slots, and the
  D-pad standing in for the rotary encoder inside its etched isometric
  cube. Controls sit in the bottom ~45% so everything falls inside a right
  thumb's arc; the display panel fills the space above.

  EVERY id AND data-btn BELOW IS LOAD-BEARING — remote.js looks up 16
  elements by id and binds all [data-btn]. Do not rename without checking
  remote.js. In particular data-btn="OK" is the wire value the uinput
  writer and InputManager agree on; only the visible label says "Enter".
-->
<!--
  THE REAL FACEPLATE MARK. Verbatim path data from the product artwork
  ("MDB Box.svg", 86x98), defined once here and referenced by <use> in both
  places it appears: the display panel watermark (.artcube) and the etched
  cube behind the D-pad (.etch). Do not redraw it by hand — this is the
  shipping logo. fill is currentColor so each instance tints via CSS `color`
  and controls its own weight via `opacity`; the artwork's own #F2E4D9 is
  exactly var(--fg), so the default colour is unchanged.

  Geometry note: 86/98 = 0.8776, i.e. a true isometric cube (a regular
  hexagon silhouette is sqrt(3)/2 = 0.866). Both instances MUST be sized on
  that ratio, never square, or the cube renders letterboxed and off-centre.
-->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;pointer-events:none">
  <defs>
    <g id="mdb-cube" fill="currentColor">
      <path d="M43.0001 49V98L0 73.5V24.5L43.0001 49ZM1.00889 72.912L41.9912 96.2616V49.587L1.00889 26.2365V72.912Z"/>
      <path d="M86 73.5L43.0001 98V49L86 24.5V73.5ZM44.0088 49.5871V96.2626L84.9911 72.912V26.2375L44.0088 49.5871Z"/>
      <path d="M86 24.5L43.0001 49L0 24.5L43.0001 0L86 24.5ZM2.03945 24.499L42.9999 47.8368L83.9594 24.5L42.9999 1.16225L2.03945 24.499Z"/>
      <path d="M8.85339 39.6324V68.456L34.1476 82.8677V54.0442L8.85339 39.6324ZM35.1564 84.6051L8.35486 69.334L7.8445 69.0439V37.895L35.1564 53.4571V84.6051Z"/>
      <path d="M78.1573 69.0438L77.647 69.3339L50.8454 84.6049V53.457L78.1573 37.8949V69.0438ZM51.8543 82.8676L77.1485 68.4559V39.6323L51.8543 54.0441V82.8676Z"/>
      <path d="M70.3335 24.4997L42.9989 40.0737L15.6644 24.4997L42.9989 8.92576L70.3335 24.4997ZM17.7048 24.4998L42.999 38.9116L68.2932 24.4998L42.999 10.088L17.7048 24.4998Z"/>
    </g>
  </defs>
</svg>

<div id="app" class="screen" data-mode="playlist">

  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <header class="hd">
    <!-- Way out of the app. An installed PWA has no address bar and no back
         button, so without this the remote is a one-way trip and the only
         escape is force-quitting. Same-origin and inside the manifest scope,
         so it navigates within the app.

         It lives INSIDE .mark, absolutely positioned to the left and centred
         on the wordmark. That is what keeps it clear of the top-left faceplate
         screw (x 28..39, y 28..39): sitting on the wordmark's centreline puts
         it well below y=39 at every safe-area value, including 0 (Safari, and
         landscape). Being absolute, it does not disturb the flex centring of
         the wordmark itself. -->
    <div class="mark">
      <a class="back home-link" href="/" aria-label="Back to Content Manager">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 4.5 L7.5 12 L15 19.5" fill="none" stroke="currentColor"
                stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <img src="/static/remote/logo.png" alt="Magic Dingus Box">
    </div>
    <div class="rule"><i></i></div>
  </header>

  <section class="disp">
    <div class="statusline">
      <span class="dot" id="conn-dot" data-state="amber"></span>
      <span class="lbl" id="np-label">CONNECTING</span>
      <span class="src" id="np-source"></span>
    </div>

    <div class="art">
      <svg viewBox="0 0 86 98" aria-hidden="true" class="artcube"><use href="#mdb-cube"/></svg>
      <div class="arttext">
        <div class="kind">NOW PLAYING</div>
        <div class="big" id="np-title">&mdash;</div>
      </div>
    </div>

    <div class="scrub-row">
      <span class="t" id="time-now">0:00</span>
      <div class="trk" id="scrub"><div class="fil" id="scrub-fill" style="width:0%"></div></div>
      <span class="t" id="time-total">0:00</span>
    </div>

    <!-- Phone-keyboard text entry. Hidden until the kiosk reports an
         active text field; body.text-mode reveals it. -->
    <section id="text-section" hidden>
      <header class="text-section__header">
        <span id="text-title" class="text-section__title"></span>
        <button id="text-clear" class="text-section__clear" type="button" aria-label="Clear">&times;</button>
      </header>
      <input
        id="text-input"
        class="text-section__input"
        type="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        enterkeyhint="search"
        aria-label="Text input"
      >
    </section>
  </section>

  <section class="ctrl">
    <!-- btn-red is the PLAY/PAUSE indicator. It lives on the GLYPH, not the
         keycap: remote.js sets its textContent, which would wipe the LED
         span if it were on the button itself. -->
    <div class="glyphs">
      <span class="g gy">&#9664;&#9664;</span>
      <span class="g gr" id="btn-red">&#9654;&#10074;</span>
      <span class="g gg">&#9654;&#9654;</span>
    </div>
    <div class="row3">
      <button class="cap y" data-btn="YELLOW" aria-label="Previous"><span class="led"></span></button>
      <button class="cap r" data-btn="RED" aria-label="Play or pause"><span class="led"></span></button>
      <button class="cap g" data-btn="GREEN" aria-label="Next"><span class="led"></span></button>
    </div>

    <button class="cap b menu" data-btn="BLACK" aria-label="Menu"><span class="led"></span></button>
    <span class="mlabel">Menu <b>&#9776;</b></span>

    <!-- Faceplate convention: short label on the control, meaning in the
         caption beside it ("Press: Enter"). Keeps the centre key legible
         while the caption carries the contextual change. -->
    <div class="legend">
      <div class="lrow"><span class="lk">Pad:</span><span class="lv nav">Nav &#8593;&#8595;</span></div>
      <div class="lrow"><span class="lk">Press:</span>
        <span class="lv act"><span class="lbl-enter">Enter &#9166;</span><span class="lbl-browse">Browse</span></span>
      </div>
    </div>

    <div class="dwrap">
      <svg class="etch" viewBox="0 0 86 98" aria-hidden="true"><use href="#mdb-cube"/></svg>
      <div class="dpad">
        <button class="d up"    data-btn="UP"    aria-label="Up"><i>&#9650;</i></button>
        <button class="d left"  data-btn="LEFT"  aria-label="Left"><i>&#9664;</i></button>
        <button class="ok" data-btn="OK" aria-label="Enter">
          <span class="lbl-enter">Enter</span><span class="lbl-browse">Browse</span>
        </button>
        <button class="d right" data-btn="RIGHT" aria-label="Right"><i>&#9654;</i></button>
        <button class="d down"  data-btn="DOWN"  aria-label="Down"><i>&#9660;</i></button>
      </div>
    </div>
  </section>

  <div id="ra-overlay" class="ra-overlay" hidden>
    <div class="ra-title" id="ra-title">Game in progress</div>
    <button class="ra-quit" data-btn="QUIT_GAME">Quit Game</button>
  </div>
</div>
<script src="/static/remote/remote.js?v=15"></script>
</body></html>
